name: Publish workflow diagram

on:
  push:
    branches:
      - main
    paths:
      - docs/diagrams/vcsentinel-multi-commit-pr.html
      - .github/workflows/pages-diagram.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Stage diagram
        run: |
          site_dir="${RUNNER_TEMP}/vcsentinel-pages"
          rm -rf "$site_dir"
          mkdir -p "$site_dir"
          cp docs/diagrams/vcsentinel-multi-commit-pr.html \
            "$site_dir/vcsentinel-multi-commit-pr.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/vcsentinel-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
