version: "2.0"
active_agent: "opencode"
agents:
  claude:
    model: "claude-opus"
    reasoning_effort: "medium"
    profiles:
      cheap:
        model: "claude-5-sonnet"
        reasoning_effort: "low"
      normal:
        model: "claude-5-sonnet"
        reasoning_effort: "high"
      deep:
        model: "claude-opus"
        reasoning_effort: "high"
      commit:
        reasoning_effort: "low"
  opencode:
    model: "openai/gpt-5.6-sol"
    reasoning_effort: "high"
    profiles:
      cheap:
        model: "openai/gpt-5.6-sol"
        reasoning_effort: "low"
      normal:
        model: "openai/gpt-5.6-sol"
        reasoning_effort: "medium"
      deep:
        model: "openai/gpt-5.6-sol"
        reasoning_effort: "high"
      commit:
        reasoning_effort: "low"
review:
  timeout: 600
  parallel: 2
  dims:
    spec: "normal"
    style: "normal"
    tests: "normal"
    logic: "deep"
    design: "deep"
    security: "deep"
validation:
  capabilities:
    format:
      command: "gofmt -l ."
      fails_when: output_not_empty
    lint:
      command: "go vet ./..."
    build:
      command: "go build ./..."
    unit_test:
      command: "go test ./..."
      timeout: 120
  profiles:
    standard: [format, lint, build, unit_test]
  mode: worktree
