version: "2.0"
active_agent: "opencode"
commit_language: "en"
# Solicita generación semántica externa; no representa consentimiento personal.
request_external_agent_diff: true
agents:
  claude:
    model: "claude-sonnet-5"
    reasoning_effort: "medium"
    profiles:
      cheap:
        model: "haiku"
        reasoning_effort: "low"
      normal:
        model: "claude-sonnet-5"
        reasoning_effort: "high"
      deep:
        model: "claude-opus-5"
        reasoning_effort: "medium"
      commit:
        reasoning_effort: "low"
  opencode:
    model: "openai/gpt-5.6-terra"
    reasoning_effort: "high"
    profiles:
      cheap:
        model: "openai/gpt-5.6-luna"
        reasoning_effort: "high"
      normal:
        model: "openai/gpt-5.6-luna"
        reasoning_effort: "max"
      deep:
        model: "openai/gpt-5.6-terra"
        reasoning_effort: "xhigh"
      commit:
        reasoning_effort: "low"
review:
  codegraph_context: true
  timeout: 900
  parallel: 5
validation:
  capabilities:
    format:
      command: "gofmt -l ."
      fails_when: output_not_empty
    lint:
      command: "go vet ./..."
    build:
      command: "go build ./..."
    unit_test:
      command: "go test ./..."
      supports_scope: true
      scoped_command: "go test {packages}"
      timeout: 120
  profiles:
    standard: [format, lint, build, unit_test]
  mode: worktree
