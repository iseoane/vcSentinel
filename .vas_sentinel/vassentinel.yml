version: "2.0"
active_agent: "claude"
commit_language: "en"
# Solicita generación semántica externa; no representa consentimiento personal.
request_external_agent_diff: true
agents:
  claude:
    model: "claude-sonnet-5"
    reasoning_effort: "medium"
    profiles:
      cheap:
        model: "haiku"
        reasoning_effort: "low"
      normal:
        model: "claude-sonnet-5"
        reasoning_effort: "high"
      deep:
        model: "claude-sonnet-5"
        reasoning_effort: "xhigh"
      commit:
        reasoning_effort: "low"
  opencode:
    model: "openai/gpt-5.6-terra"
    reasoning_effort: "high"
    profiles:
      cheap:
        model: "openai/gpt-5.6-luna"
        reasoning_effort: "high"
      normal:
        model: "openai/gpt-5.6-luna"
        reasoning_effort: "xhigh"
      deep:
        model: "openai/gpt-5.6-terra"
        reasoning_effort: "high"
      commit:
        reasoning_effort: "low"
#    model: "opencode-go/muse-spark-1.3-contributor"
#    reasoning_effort: "xhigh"
#    profiles:
#      cheap:
#        model: "opencode-go/glm-5.3-flash"
#        reasoning_effort: "high"
#      normal:
#        model: "opencode-go/muse-spark-1.3-contributor"
#        reasoning_effort: "high"
#      deep:
#        model: "opencode-go/muse-spark-1.3-contributor"
#        reasoning_effort: "xhigh"
#      commit:
#        reasoning_effort: "low"
review:
  codegraph_context: true
  timeout: 900
  parallel: 2
validation:
  capabilities:
    format:
      command: "gofmt -l ."
      fails_when: output_not_empty
    lint:
      command: "go vet ./..."
    build:
      command: "go build ./..."
    unit_test:
      command: "go test ./..."
      supports_scope: true
      scoped_command: "go test {packages}"
      timeout: 120
  profiles:
    standard: [format, lint, build, unit_test]
  mode: worktree
# CI evidence for `pr create`: it polls this workflow and embeds the outcome in
# the published body. Without this block CI is disabled entirely and the `ci`
# step stays not_observed, which reads as "no CI" even though GitHub runs
# .github/workflows/ci.yml on every pull request.
ci:
  workflow: "CI"
  wait_seconds: 900
  poll_seconds: 15
